<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90E2; 
            --primary-gradient: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            --bg-gradient: linear-gradient(180deg, #F0F4F8 0%, #E6F0FA 100%);
            --white: #FFFFFF;
            --text-dark: #2C3E50;
            --teacher-color: #F1C40F; 
            --student-color: #2ECC71; 
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            background: var(--bg-gradient); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        .container { 
            background: var(--white); 
            padding: 30px 25px; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(74, 144, 226, 0.12); 
            width: 100%; 
            max-width: 480px; 
            box-sizing: border-box; 
            position: relative; 
        }
        
        #login-screen { text-align: center; }
        
        .login-heading {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0; 
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 26px;
        }

        .logo-container {
            width: 100%;
            max-width: 260px; 
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.05));
        }
        .logo-container img {
            width: 100%;
            height: auto;
            object-fit: contain; 
        }

        input, select { 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            border: 2px solid #E2E8F0; 
            border-radius: 14px; 
            font-family: 'Prompt'; 
            font-size: 15px; 
            box-sizing: border-box; 
            transition: all 0.3s ease;
            background-color: #F8FAFC;
            color: var(--text-dark);
        }
        input:focus, select:focus {
            border-color: var(--primary);
            background-color: var(--white);
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.15);
            outline: none;
        }
        
        .btn { 
            background: var(--primary-gradient); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 14px; 
            width: 100%; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 16px; 
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.3);
            transition: transform 0.2s, box-shadow 0.2s; 
        }
        .btn:hover { 
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.4);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn:disabled { 
            background: #bdc3c7; 
            box-shadow: none;
            cursor: not-allowed; 
            transform: none;
        }

        #bus-screen { display: none; }
        
        /* 📊 สไตล์ Dashboard ภาพรวมรถบัส */
        .dashboard {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            padding: 12px;
            font-size: 12px;
            color: var(--text-dark);
            line-height: 1.6;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* 🕒 สไตล์ตัวนับเวลาถอยหลัง */
        .timer-banner {
            display: none;
            background: #FFF5F5;
            border: 1px solid #FED7D7;
            color: #C53030;
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.9; }
            50% { opacity: 1; transform: scale(1.01); }
            100% { opacity: 0.9; }
        }

        .bus-layout { 
            display: grid; 
            grid-template-columns: 1fr 1fr 40px 1fr 1fr; 
            gap: 10px; 
            margin-top: 15px; 
            align-items: center;
        }
        
        .seat { background: #E6F0FA; color: var(--primary); padding: 8px 0; text-align: center; border-radius: 12px; font-weight: bold; cursor: pointer; border: 2px solid transparent; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 54px; box-sizing: border-box; transition: all 0.2s; }
        .seat .seat-num { font-size: 16px; }
        .seat .occupant-name { font-size: 10px; font-weight: normal; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
        
        .seat.selected { background: var(--primary) !important; color: white !important; }
        .seat.booked-ครู { background: var(--teacher-color) !important; color: #2C3E50 !important; cursor: not-allowed; }
        .seat.booked-นักเรียน { background: var(--student-color) !important; color: white !important; cursor: not-allowed; }
        
        .facility { grid-column: span 2; background: #E0E6ED; display: flex; justify-content: center; align-items: center; border-radius: 12px; font-size: 13px; font-weight: bold; color: var(--text-dark); min-height: 54px; }
        .emergency { grid-column: span 2; border: 2px dashed #ff6b6b; color: #ff6b6b; display: flex; justify-content: center; align-items: center; border-radius: 12px; font-size: 13px; font-weight: bold; min-height: 54px; box-sizing: border-box; }
        
        .aisle { grid-column: span 1; }

        .legend { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 12px; margin-bottom: 15px; background: #f8fafc; padding: 10px; border-radius: 12px; }
        .lg-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 14px; height: 14px; border-radius: 4px; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 85%;
            max-width: 350px;
            animation: popupAnim 0.3s ease-out;
        }
        @keyframes popupAnim {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-title { color: var(--student-color); font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .modal-body { font-size: 16px; color: var(--text-dark); line-height: 1.6; margin-bottom: 20px; text-align: left; background: #f8fafc; padding: 15px; border-radius: 12px; }

        .developer-credit {
            margin-top: 25px;
            font-size: 11px;
            color: #a0aec0;
            text-align: center;
            border-top: 1px dashed #edf2f7;
            padding-top: 12px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <div class="logo-container">
            <img src="https://img1.pic.in.th/images/Untitled-design25ed5cd8f43acf9c.png" alt="Logo">
        </div>
        <h2 class="login-heading">ระบบจองที่นั่งรถบัส</h2>
        <input type="text" id="username" placeholder="กรอกชื่อ-นามสกุลจริง">
        <select id="user-role">
            <option value="นักเรียน">นักเรียน (Student)</option>
            <option value="ครู">ครู (Teacher)</option>
        </select>
        <button class="btn" style="margin-top: 10px;" onclick="startBooking()">เข้าสู่หน้าเลือกที่นั่ง</button>
        
        <div class="developer-credit">พัฒนาโดย ธนยศ ฐิตะสาร</div>
    </div>

    <div id="bus-screen">
        <h3 id="display-name" style="margin:0; color:var(--primary)"></h3>
        <p id="display-role" style="margin:4px 0 12px 0; font-size:13px; color:#7f8c8d"></p>
        
        <div id="bus-dashboard" class="dashboard">
            📊 <b>ภาพรวมรถบัส:</b> กำลังดึงข้อมูล...
        </div>

        <div id="timer-banner" class="timer-banner">
            🕒 กรุณายืนยันที่นั่งภายในเวลา <span id="countdown-clock">03:00</span> นาที
        </div>

        <div class="legend">
            <div class="lg-item"><div class="dot" style="background:#E6F0FA"></div> ว่าง</div>
            <div class="lg-item"><div class="dot" style="background:var(--primary)"></div> ที่นั่งที่คุณเลือก</div>
            <div class="lg-item"><div class="dot" style="background:var(--teacher-color)"></div> ครูจอง (สีเหลือง)</div>
            <div class="lg-item"><div class="dot" style="background:var(--student-color)"></div> นักเรียนจอง (สีเขียว)</div>
        </div>

        <div id="bus-grid" class="bus-layout"></div>

        <div style="margin-top:20px; border-top:1px solid #eee; padding-top:15px">
            <div id="status-text" style="font-size:15px; font-weight:bold;">ยังไม่ได้เลือกที่นั่ง (เลือกได้ 1 ที่)</div>
            <button class="btn" id="submit-btn" style="margin-top:12px;" onclick="submitData()">ยืนยันการล็อกที่นั่ง</button>
        </div>

        <div class="developer-credit">พัฒนาโดย ธนยศ ฐิตะสาร</div>
    </div>
</div>

<div id="custom-modal" class="modal-overlay">
    <div class="modal-box">
        <div id="modal-status-title" class="modal-title">🎉 จองสำเร็จ!</div>
        <div id="modal-status-body" class="modal-body"></div>
        <button class="btn" onclick="closeModalAndGoHome()">รับทราบ และกลับหน้าแรก</button>
    </div>
</div>

<script>
    let userName = "";
    let userRole = "";
    let selectedSeat = null; 
    let bookedSeatsData = {};
    let realtimeTimer = null;
    
    // ตัวแปรเกี่ยวกับระบบนับเวลา (Timeout)
    let countdownTimer = null;
    let secondsLeft = 90; // 1.3 นาที = 90 วินาที

    const busStructure = [
        { type: 'facility', text: 'บันไดหน้า / TV' }, { type: 'aisle' }, { type: 'seat', num: 1 }, { type: 'seat', num: 2 },
        { type: 'seat', num: 3 }, { type: 'seat', num: 4 }, { type: 'aisle' }, { type: 'seat', num: 5 }, { type: 'seat', num: 6 },
        { type: 'seat', num: 7 }, { type: 'seat', num: 8 }, { type: 'aisle' }, { type: 'seat', num: 9 }, { type: 'seat', num: 10 },
        { type: 'seat', num: 11 }, { type: 'seat', num: 12 }, { type: 'aisle' }, { type: 'seat', num: 13 }, { type: 'seat', num: 14 },
        { type: 'seat', num: 15 }, { type: 'seat', num: 16 }, { type: 'aisle' }, { type: 'seat', num: 17 }, { type: 'seat', num: 18 },
        { type: 'seat', num: 19 }, { type: 'seat', num: 20 }, { type: 'aisle' }, { type: 'seat', num: 21 }, { type: 'seat', num: 22 },
        { type: 'facility', text: 'บันไดหลัง / TV' }, { type: 'aisle' }, { type: 'seat', num: 23 }, { type: 'seat', num: 24 },
        { type: 'seat', num: 25 }, { type: 'seat', num: 26 }, { type: 'aisle' }, { type: 'seat', num: 27 }, { type: 'seat', num: 28 },
        { type: 'seat', num: 29 }, { type: 'seat', num: 30 }, { type: 'aisle' }, { type: 'seat', num: 31 }, { type: 'seat', num: 32 },
        { type: 'seat', num: 33 }, { type: 'seat', num: 34 }, { type: 'aisle' }, { type: 'seat', num: 35 }, { type: 'seat', num: 36 },
        { type: 'seat', num: 37 }, { type: 'seat', num: 38 }, { type: 'aisle' }, { type: 'emergency', text: 'ประตูฉุกเฉิน 🚪' },
        { type: 'seat', num: 39 }, { type: 'seat', num: 40 }, { type: 'aisle' }, { type: 'seat', num: 41 }, { type: 'seat', num: 42 }
    ];

    function startBooking() {
        userName = document.getElementById('username').value.trim();
        userRole = document.getElementById('user-role').value;
        if (!userName) {
            alert("กรุณากรอกชื่อก่อนเข้าใช้งานครับ!");
            return;
        }

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('bus-screen').style.display = 'block';
        document.getElementById('display-name').innerText = "คุณ: " + userName;
        document.getElementById('display-role').innerText = "สิทธิ์การใช้งาน: " + userRole;

        fetchData();
        startRealtime();
    }

    function startRealtime() {
        if (!realtimeTimer) {
            realtimeTimer = setInterval(fetchData, 3000);
        }
    }

    function stopRealtime() {
        if (realtimeTimer) {
            clearInterval(realtimeTimer);
            realtimeTimer = null;
        }
    }

    function fetchData() {
        google.script.run
            .withSuccessHandler(function(booked) {
                bookedSeatsData = booked;
                updateDashboard(); // อัปเดตยอดสรุปด้านบน
                renderBus();
            })
            .withFailureHandler(function(err) {
                console.error("ดึงข้อมูลล้มเหลว:", err);
            })
            .getBookedSeats();
    }

    // 📊 ฟังก์ชันคำนวณและอัปเดต Dashboard
    function updateDashboard() {
        let totalSeats = 42;
        let bookedCount = Object.keys(bookedSeatsData).length;
        let teacherCount = 0;
        let studentCount = 0;

        for (let seat in bookedSeatsData) {
            if (bookedSeatsData[seat].role === "ครู") teacherCount++;
            if (bookedSeatsData[seat].role === "นักเรียน") studentCount++;
        }

        let emptySeats = totalSeats - bookedCount;

        document.getElementById('bus-dashboard').innerHTML = 
            `📊 <b>ภาพรวมรถบัส:</b> จองแล้ว ${bookedCount}/${totalSeats} ที่นั่ง | ` +
            `🟩 นักเรียน: ${studentCount} คน | ` +
            `🟨 ครู: ${teacherCount} คน | ` +
            `🟦 ที่นั่งว่างคงเหลือ: ${emptySeats} ที่`;
    }

    function renderBus() {
        const grid = document.getElementById('bus-grid');
        grid.innerHTML = ""; 

        busStructure.forEach(item => {
            if (item.type === 'aisle') {
                const aisleDiv = document.createElement('div');
                aisleDiv.className = 'aisle';
                grid.appendChild(aisleDiv);
            } else if (item.type === 'facility') {
                const div = document.createElement('div');
                div.className = 'facility';
                div.innerText = item.text;
                grid.appendChild(div);
            } else if (item.type === 'emergency') {
                const div = document.createElement('div');
                div.className = 'emergency';
                div.innerText = item.text;
                grid.appendChild(div);
            } else if (item.type === 'seat') {
                const seatDiv = document.createElement('div');
                seatDiv.className = 'seat';
                
                const numSpan = document.createElement('span');
                numSpan.className = 'seat-num';
                numSpan.innerText = item.num;
                seatDiv.appendChild(numSpan);

                if (bookedSeatsData[item.num]) {
                    const booking = bookedSeatsData[item.num];
                    seatDiv.classList.add('booked-' + booking.role); 
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'occupant-name';
                    nameSpan.innerText = booking.name; 
                    seatDiv.appendChild(nameSpan);
                } else {
                    if (selectedSeat === item.num) {
                        seatDiv.classList.add('selected');
                    }
                    seatDiv.onclick = () => selectSeat(seatDiv, item.num);
                }
                grid.appendChild(seatDiv);
            }
        });
    }

    function selectSeat(el, num) {
        if (selectedSeat === num) {
            selectedSeat = null;
            el.classList.remove('selected');
            document.getElementById('status-text').innerText = "ยังไม่ได้เลือกที่นั่ง (เลือกได้ 1 ที่)";
            stopTimeoutCounter(); // ยกเลิกการนับเวลาถ้าปล่อยเบาะว่าง
        } else {
            document.querySelectorAll('.seat.selected').forEach(seat => seat.classList.remove('selected'));
            selectedSeat = num;
            el.classList.add('selected');
            document.getElementById('status-text').innerText = "ที่นั่งที่เลือก: หมายเลข " + num;
            startTimeoutCounter(); // เริ่มนับเวลาถอยหลังทันทีเมื่อเลือกเบาะ
        }
    }

    // 🕒 ระบบตัวนับเวลาถอยหลัง (Timeout Counter)
    function startTimeoutCounter() {
        stopTimeoutCounter(); // ล้างตัวเก่าก่อนถ้ามี
        secondsLeft = 90; // ตั้งเวลา 1.3 นาที (90 วินาที)
        document.getElementById('timer-banner').style.display = "block";
        updateClockDisplay();

        countdownTimer = setInterval(function() {
            secondsLeft--;
            updateClockDisplay();

            if (secondsLeft <= 0) {
                stopTimeoutCounter();
                // เมื่อหมดเวลาทำการล้างค่าเบาะที่เลือก และแจ้งเตือนผู้ใช้งาน
                selectedSeat = null;
                document.getElementById('status-text').innerText = "ยังไม่ได้เลือกที่นั่ง (เลือกได้ 1 ที่)";
                renderBus();
                
                document.getElementById('modal-status-title').innerText = "❌ หมดเวลาทำรายการ";
                document.getElementById('modal-status-title').style.color = "#ff6b6b";
                document.getElementById('modal-status-body').innerText = "คุณไม่ได้ยืนยันที่นั่งภายในเวลา 1 นาที 30 วินาที ระบบจึงทำการคืนสิทธิ์ที่นั่งให้กับผู้อื่น กรุณาเลือกใหม่อีกครั้งครับ";
                document.getElementById('custom-modal').style.display = "flex";
            }
        }, 1000);
    }

    function stopTimeoutCounter() {
        if (countdownTimer) {
            clearInterval(countdownTimer);
            countdownTimer = null;
        }
        document.getElementById('timer-banner').style.display = "none";
    }

    function updateClockDisplay() {
        let mins = Math.floor(secondsLeft / 60);
        let secs = secondsLeft % 60;
        document.getElementById('countdown-clock').innerText = 
            (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
    }

    function submitData() {
        if (!selectedSeat) {
            alert("กรุณาเลือกที่นั่งที่ต้องการจองก่อนครับ");
            return;
        }
        
        stopTimeoutCounter(); // หยุดเวลานับถอยหลังเมื่อกดบันทึกข้อมูลแล้ว
        stopRealtime();
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('submit-btn').innerText = "กำลังบันทึกข้อมูล...";

        const currentName = userName;
        const currentSeat = selectedSeat;
        const currentRole = userRole;

        google.script.run
            .withSuccessHandler(function(result) {
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('submit-btn').innerText = "ยืนยันการล็อกที่นั่ง";

                if (result.indexOf("ERROR:") !== -1) {
                    document.getElementById('modal-status-title').innerText = "❌ ไม่สามารถจองได้";
                    document.getElementById('modal-status-title').style.color = "#ff6b6b";
                    document.getElementById('modal-status-body').innerText = result.replace("ERROR: ", "");
                    document.getElementById('custom-modal').style.display = "flex";
                } else if (result === "SUCCESS") {
                    document.getElementById('modal-status-title').innerText = "🎉 จองสำเร็จ!";
                    document.getElementById('modal-status-title').style.color = "var(--student-color)";
                    document.getElementById('modal-status-body').innerHTML = `<b>ชื่อผู้จอง:</b> ${currentName}<br><b>สิทธิ์ตำแหน่ง:</b> ${currentRole}<br><b>หมายเลขที่นั่ง:</b> ${currentSeat}`;
                    
                    document.getElementById('custom-modal').style.display = "flex";
                    
                    selectedSeat = null;
                    document.getElementById('username').value = "";
                    document.getElementById('user-role').selectedIndex = 0;
                    document.getElementById('status-text').innerText = "ยังไม่ได้เลือกที่นั่ง (เลือกได้ 1 ที่)";
                }
            })
            .withFailureHandler(function(err) {
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('submit-btn').innerText = "ยืนยันการล็อกที่นั่ง";
                alert("ระบบเชื่อมต่อขัดข้อง กรุณาลองใหม่อีกครั้ง");
                startRealtime();
            })
            .saveBooking(currentName, currentRole, currentSeat);
    }

    function closeModalAndGoHome() {
        document.getElementById('custom-modal').style.display = "none";
        if (document.getElementById('modal-status-title').innerText.indexOf("❌") !== -1 && 
            document.getElementById('modal-status-body').innerText.indexOf("หมดเวลา") === -1) {
            startRealtime();
        } else {
            // หากจองสำเร็จ หรือหมดเวลาทำรายการ ให้เด้งกลับหน้าล็อกอิน
            document.getElementById('bus-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
        }
    }
</script>

</body>
</html>
